services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: final # <--- Uses lean production stage
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    environment:
      DATABASE_HOST: db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: the_notebook_calendar_production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5